name: Feature request
description: Suggest a non-sensitive improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Do not include workbooks, Google Sheet URLs, customer IDs, campaign or search-term data, performance values, or secrets.
  - type: checkboxes
    id: redaction
    attributes:
      label: Redaction confirmation
      options:
        - label: I removed advertiser data, customer IDs, Google Sheet URLs, campaign/search-term data, performance values, and secrets.
          required: true
  - type: textarea
    id: request
    attributes:
      label: Requested outcome
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Safe context
    validations:
      required: true
